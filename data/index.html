<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Reader</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #f5f0e8;
        --surface: #faf7f2;
        --border: #d6cfc2;
        --border-strong: #b8ae9e;
        --text: #2c2416;
        --text-muted: #7a6e5f;
        --accent: #8b4513;
        --accent-light: #f0e6d8;
        --accent-hover: #6e360f;
        --ink: #1a1206;
        --danger: #a33;
        --danger-hover: #7a1f1f;
      }
      [data-theme="dark"] {
        --bg: #1a1a1a;
        --surface: #252525;
        --border: #3a3a3a;
        --border-strong: #4a4a4a;
        --text: #e0dcd4;
        --text-muted: #8a8578;
        --accent: #c8a46e;
        --accent-light: #3a3228;
        --accent-hover: #d4b88a;
        --ink: #f0ebe0;
        --danger: #e55;
        --danger-hover: #ff6666;
      }
      body {
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 2rem 1rem;
        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(180, 160, 120, 0.12) 27px,
          rgba(180, 160, 120, 0.12) 28px
        );
      }
      [data-theme="dark"] body {
        background-image: none;
      }
      .page {
        width: 100%;
        max-width: 480px;
      }
      .header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .book-icon {
        width: 44px;
        height: 44px;
        margin: 0 auto 0.75rem;
        display: block;
      }
      h1 {
        font-size: 1.7rem;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 0.2rem;
      }
      .subtitle {
        font-size: 0.82rem;
        color: var(--text-muted);
        font-style: italic;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1.75rem;
        box-shadow:
          0 2px 8px rgba(44, 36, 22, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        position: relative;
        margin-bottom: 1.25rem;
      }
      [data-theme="dark"] .card {
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: linear-gradient(to bottom, #c8a46e, #8b5e3c, #c8a46e);
        border-radius: 4px 0 0 4px;
      }
      .section-label {
        display: block;
        font-size: 0.68rem;
        font-family: "Courier New", monospace;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
      }
      .upload-area {
        border: 2px dashed var(--border-strong);
        border-radius: 4px;
        padding: 1.5rem;
        text-align: center;
        background: #fff;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
        margin-bottom: 0.75rem;
        position: relative;
      }
      .upload-area:hover,
      .upload-area.dragover {
        border-color: var(--accent);
        background: var(--accent-light);
      }
      .upload-area input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }
      .upload-icon {
        font-size: 2rem;
        margin-bottom: 0.4rem;
      }
      .upload-label {
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .upload-label strong {
        color: var(--ink);
      }
      .chosen-file {
        font-size: 0.8rem;
        font-family: monospace;
        color: var(--accent);
        margin-top: 0.4rem;
      }
      button.primary {
        width: 100%;
        font-family: Georgia, serif;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 3px;
        padding: 0.72rem 1rem;
        cursor: pointer;
        transition: background 0.15s;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button.primary:disabled {
        background: var(--border-strong);
        cursor: not-allowed;
      }
      #uploadStatus {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        font-family: monospace;
        min-height: 1.2em;
        color: var(--accent);
      }
      .book-list {
        list-style: none;
      }
      .book-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.55rem 0.6rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
        gap: 0.5rem;
      }
      .book-item:last-child {
        border-bottom: none;
      }
      .book-name {
        color: var(--ink);
        flex: 1;
        word-break: break-all;
      }
      .book-size {
        font-size: 0.7rem;
        font-family: monospace;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .btn-delete {
        font-family: monospace;
        font-size: 0.72rem;
        padding: 0.25rem 0.5rem;
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
        border-radius: 2px;
        cursor: pointer;
        white-space: nowrap;
        width: auto;
        transition:
          background 0.1s,
          color 0.1s;
      }
      .btn-delete:hover {
        background: var(--danger);
        color: #fff;
      }
      .empty-note {
        padding: 0.75rem;
        text-align: center;
        color: var(--text-muted);
        font-style: italic;
        font-size: 0.85rem;
      }
      .nav-links {
        text-align: center;
        margin-top: 0.5rem;
      }
      .nav-links a {
        font-size: 0.78rem;
        font-family: monospace;
        color: var(--accent);
        text-decoration: none;
      }
      .nav-links a:hover {
        text-decoration: underline;
      }
      footer {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.68rem;
        font-family: monospace;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <svg
          class="book-icon"
          viewBox="0 0 48 48"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect
            x="6"
            y="6"
            width="28"
            height="36"
            rx="2"
            fill="#c8a46e"
            stroke="#8b5e3c"
            stroke-width="1.5"
          />
          <rect
            x="10"
            y="6"
            width="4"
            height="36"
            fill="#8b5e3c"
            opacity="0.4"
          />
          <line
            x1="16"
            y1="15"
            x2="28"
            y2="15"
            stroke="#8b5e3c"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <line
            x1="16"
            y1="21"
            x2="28"
            y2="21"
            stroke="#8b5e3c"
            stroke-width="1"
            stroke-linecap="round"
            opacity="0.6"
          />
          <line
            x1="16"
            y1="27"
            x2="23"
            y2="27"
            stroke="#8b5e3c"
            stroke-width="1"
            stroke-linecap="round"
            opacity="0.6"
          />
          <rect
            x="34"
            y="10"
            width="8"
            height="28"
            rx="1"
            fill="#d4b88a"
            stroke="#8b5e3c"
            stroke-width="1"
          />
        </svg>
        <h1>E-Reader</h1>
        <p class="subtitle">ESP32 &mdash; upload .txt books over WiFi</p>
      </div>

      <div class="card">
        <span class="section-label">Upload a book</span>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept=".txt" />
          <div class="upload-icon">📖</div>
          <div class="upload-label">
            <strong>Choose a .txt file</strong> or drag it here
          </div>
          <div class="chosen-file" id="chosenFile"></div>
        </div>
        <button class="primary" id="uploadBtn" disabled>Upload Book</button>
        <div id="uploadStatus"></div>
      </div>

      <div class="card">
        <span class="section-label">Books on device</span>
        <ul class="book-list" id="bookList">
          <li class="empty-note">Loading&hellip;</li>
        </ul>
      </div>

      <div class="nav-links">
        <a href="/settings">&#9881; Settings</a>
        &nbsp;&middot;&nbsp;
        <a href="/edit">&#9998; Rename books</a>
        &nbsp;&middot;&nbsp;
        <a href="/library">&#128218; Library</a>
        &nbsp;&middot;&nbsp;
        <a href="/bookmarks.html">&#128278; Bookmarks</a>
      </div>

      <footer>192.168.4.1 &mdash; E-Reader firmware</footer>
    </div>

    <script>
      var fileInput = document.getElementById("fileInput");
      var uploadBtn = document.getElementById("uploadBtn");
      var chosenFile = document.getElementById("chosenFile");
      var uploadArea = document.getElementById("uploadArea");
      var status = document.getElementById("uploadStatus");

      fileInput.addEventListener("change", function () {
        if (fileInput.files.length) {
          chosenFile.textContent = fileInput.files[0].name;
          uploadBtn.disabled = false;
        }
      });

      uploadArea.addEventListener("dragover", function (e) {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });
      uploadArea.addEventListener("dragleave", function () {
        uploadArea.classList.remove("dragover");
      });
      uploadArea.addEventListener("drop", function (e) {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        var f = e.dataTransfer.files[0];
        if (f) {
          fileInput.files = e.dataTransfer.files;
          chosenFile.textContent = f.name;
          uploadBtn.disabled = false;
        }
      });

      uploadBtn.addEventListener("click", function () {
        var file = fileInput.files[0];
        if (!file) return;
        var fd = new FormData();
        fd.append("file", file);
        uploadBtn.disabled = true;
        status.textContent = "Uploading...";
        fetch("/upload", { method: "POST", body: fd })
          .then(function (r) {
            return r.text();
          })
          .then(function (t) {
            status.textContent = "✓ " + t;
            fileInput.value = "";
            chosenFile.textContent = "";
            uploadBtn.disabled = true;
            fetchBooks();
          })
          .catch(function (e) {
            status.textContent = "✗ Error: " + e.message;
            uploadBtn.disabled = false;
          });
      });

      function fetchBooks() {
        fetch("/list")
          .then(function (r) {
            return r.json();
          })
          .then(function (files) {
            var list = document.getElementById("bookList");
            if (!files.length) {
              list.innerHTML =
                '<li class="empty-note">No books yet — upload one above.</li>';
              return;
            }
            list.innerHTML = "";
            files.forEach(function (f) {
              var li = document.createElement("li");
              li.className = "book-item";
              li.innerHTML =
                '<span class="book-name">' +
                f.name +
                "</span>" +
                '<span class="book-size">' +
                (f.size / 1024).toFixed(1) +
                " KB</span>" +
                '<button class="btn-delete" data-name="' +
                f.name +
                '">Delete</button>';
              list.appendChild(li);
            });
            list.querySelectorAll(".btn-delete").forEach(function (btn) {
              btn.addEventListener("click", function () {
                if (!confirm('Delete "' + btn.dataset.name + '"?')) return;
                fetch(
                  "/delete?name=" + encodeURIComponent(btn.dataset.name),
                ).then(function () {
                  fetchBooks();
                });
              });
            });
          })
          .catch(function () {
            document.getElementById("bookList").innerHTML =
              '<li class="empty-note">Could not load books.</li>';
          });
      }

      fetchBooks();

      (function() {
        var saved = localStorage.getItem("theme");
        if (saved === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </body>
</html>
